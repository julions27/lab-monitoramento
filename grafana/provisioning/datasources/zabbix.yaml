apiVersion: 1

# Apaga e recria o datasource a cada inicialização.
# Necessário porque o uid foi fixado depois da criação; com uid fixo, recriar é inofensivo.
deleteDatasources:
  - name: Zabbix
    orgId: 1

datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    jsonData:
      authType: token
      trends: true
    secureJsonData:
      apiToken: $ZABBIX_API_TOKEN
    version: 1
    editable: false
