services:
  postgres-server:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.32
    container_name: zabbix-server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      DB_SERVER_HOST: postgres-server
    depends_on:
      postgres-server:
        condition: service_healthy
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge

volumes:
  postgres_data:

